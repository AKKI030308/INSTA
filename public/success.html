<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Payment...</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d0b12;
    }
  </style>
</head>

<body>

<script>
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("order_id");

  if (orderId) {
    window.location.replace(
      "/api/verify-order?order_id=" +
      encodeURIComponent(orderId)
    );
  } else {
    window.location.replace("/index.html?payment=error");
  }
</script>

</body>
</html>
